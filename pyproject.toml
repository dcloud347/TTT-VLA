[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-ttt"
version = "0.1.0"
description = "Stateful fast-weight VLA policies for RoboMME-Plus"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.9.1",
  "torchvision==0.24.1",
  "numpy==1.26.4",
  "PyYAML>=6.0",
  "Pillow>=10",
  "h5py>=3.11",
]

[project.optional-dependencies]
wandb = ["wandb>=0.23,<1"]
groot = [
  "transformers==4.57.3",
  "huggingface-hub>=0.34,<1",
  "safetensors>=0.4",
  "diffusers==0.35.1",
  "einops==0.8.1",
  "dm-tree>=0.1.8",
  "albumentations==1.4.18",
  "opencv-python-headless==4.11.0.86",
  "scipy==1.15.3",
  "omegaconf==2.3.0",
  "tyro==0.9.17",
  "pandas==2.2.3",
  "tqdm>=4.67",
]
robomme = [
  "mani-skill @ git+https://github.com/YinpeiDai/ManiSkill.git@07be6fbc66350ddca200abfb0a11b692f078f7fd",
  "robomme @ git+https://github.com/RoboMME/robomme_benchmark.git@1f08ca5a4573eda164906dbfcf2f3511a7b62e90",
  "opencv-python==4.11.0.86",
  "setuptools==80.9.0",
]

[project.scripts]
vla-ttt = "vla_ttt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

